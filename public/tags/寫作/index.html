    <script>
(function () {
  var refs = document.querySelectorAll('.footnote-ref');
  if (!refs.length) return;

  var tooltip = document.createElement('div');
  tooltip.className = 'footnote-tooltip';
  tooltip.style.display = 'none';
  document.body.appendChild(tooltip);

  function showTooltip(ref) {
    var href = ref.getAttribute('href');
    var id = decodeURIComponent(href.slice(1));   
    var note = document.getElementById(id);        
    if (!note) return;

    var clone = note.cloneNode(true);
    var backref = clone.querySelector('.footnote-backref');
    if (backref) backref.remove();
    tooltip.innerHTML = clone.innerHTML;

    var rect = ref.getBoundingClientRect();
    tooltip.style.display = 'block';
    var top = rect.top + window.scrollY - tooltip.offsetHeight - 8;
    var left = rect.left + window.scrollX - (tooltip.offsetWidth / 2) + (rect.width / 2);
    left = Math.max(8, Math.min(left, window.innerWidth - tooltip.offsetWidth - 8));

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  refs.forEach(function (ref) {
    ref.addEventListener('mouseenter', function () { showTooltip(ref); });
    ref.addEventListener('mouseleave', hideTooltip);
    ref.addEventListener('focus', function () { showTooltip(ref); });
    ref.addEventListener('blur', hideTooltip);
    ref.addEventListener('click', function (e) {
      e.preventDefault();
      if (tooltip.style.display === 'block') {
        hideTooltip();
      } else {
        showTooltip(ref);
      }
    });
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.footnote-ref')) hideTooltip();
  });
})();
</script>
    <script>
(function () {
  var btns = document.querySelectorAll('.random-post-btn');
  if (!btns.length) return;

  btns.forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var url = btn.getAttribute('data-random-json');
      if (!url) return;

      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (list) {
          if (!list || !list.length) return;
          var pick = list[Math.floor(Math.random() * list.length)];
          if (pick && pick.url) window.location.href = pick.url;
        })
        .catch(function (err) {
          console.error('Random post: could not load post list.', err);
        });
    });
  });
})();
</script>
