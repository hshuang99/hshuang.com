<script>
(function () {
    var root = document.getElementById('gallery');
    if (!root) return;

    var items;
    try { items = JSON.parse(root.getAttribute('data-items') || '[]'); } catch (e) { items = []; }
    if (!items.length) return;

    var L = {
        close: root.getAttribute('data-close') || 'Close',
        prev: root.getAttribute('data-prev') || 'Previous',
        next: root.getAttribute('data-next') || 'Next',
        mentioned: root.getAttribute('data-mentioned') || '',
        original: root.getAttribute('data-original') || 'Original'
    };

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }
    function button(cls, label, glyph) {
        var b = el('button', 'lb-btn ' + cls, glyph);
        b.type = 'button';
        b.setAttribute('aria-label', label);
        return b;
    }

    
    var box = el('div', 'lb');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-hidden', 'true');

    var closeBtn = button('lb-close', L.close, '\u00d7');
    var prevBtn = button('lb-prev', L.prev, '\u2039');
    var nextBtn = button('lb-next', L.next, '\u203a');
    var counter = el('div', 'lb-count');

    var stage = el('div', 'lb-stage');
    var fig = el('figure', 'lb-fig');
    var img = el('img', 'lb-img');
    
    [['filter', 'none'], ['-webkit-filter', 'none'], ['mix-blend-mode', 'normal'], ['image-rendering', 'auto']].forEach(function (d) {
        img.style.setProperty(d[0], d[1], 'important');
    });
    fig.appendChild(img);
    stage.appendChild(fig);

    var info = el('div', 'lb-info');
    var cap = el('div', 'lb-cap');
    var postsTitle = el('div', 'lb-posts-title', L.mentioned);
    var postsUl = el('ul', 'lb-posts');
    var orig = el('a', 'lb-orig', L.original);
    orig.target = '_blank';
    orig.rel = 'noopener';
    info.appendChild(cap);
    info.appendChild(postsTitle);
    info.appendChild(postsUl);
    info.appendChild(orig);

    [closeBtn, prevBtn, nextBtn, counter, stage, info].forEach(function (n) { box.appendChild(n); });
    document.body.appendChild(box);

    var idx = -1, openerEl = null, postLinks = [], savedOverflow = '';
    var multi = items.length > 1;
    prevBtn.style.display = nextBtn.style.display = multi ? '' : 'none';

    function render(i) {
        var n = items.length;
        idx = ((i % n) + n) % n;
        var it = items[idx];
        img.src = it.f;
        img.alt = it.c || '';
        cap.textContent = it.c || '';
        cap.style.display = it.c ? '' : 'none';
        box.setAttribute('aria-label', it.c || document.title);

        postsUl.innerHTML = '';
        postLinks = [];
        (it.p || []).forEach(function (p) {
            var li = el('li');
            var a = el('a', null, p.t);
            a.href = p.u;
            li.appendChild(a);
            if (p.d) li.appendChild(el('span', 'lb-date', p.d));
            postsUl.appendChild(li);
            postLinks.push(a);
        });
        postsTitle.style.display = postLinks.length ? '' : 'none';
        orig.href = it.f;
        counter.textContent = (idx + 1) + ' / ' + n;

        if (multi) {   
            [idx + 1, idx - 1].forEach(function (j) {
                var pre = new Image();
                pre.src = items[((j % n) + n) % n].f;
            });
        }
    }

    function open(i, opener) {
        openerEl = opener || null;
        render(i);
        box.className = 'lb lb-open';
        box.setAttribute('aria-hidden', 'false');
        savedOverflow = document.documentElement.style.overflow;
        document.documentElement.style.overflow = 'hidden';
        closeBtn.focus();
    }

    function close() {
        box.className = 'lb';
        box.setAttribute('aria-hidden', 'true');
        document.documentElement.style.overflow = savedOverflow;
        img.removeAttribute('src');
        if (openerEl && openerEl.focus) openerEl.focus();
        idx = -1;
    }

    function isOpen() { return idx >= 0; }

    closeBtn.addEventListener('click', close);
    prevBtn.addEventListener('click', function () { render(idx - 1); });
    nextBtn.addEventListener('click', function () { render(idx + 1); });
    stage.addEventListener('click', function (e) { if (e.target === stage) close(); });

    document.addEventListener('keydown', function (e) {
        if (!isOpen()) return;
        if (e.key === 'Escape') { e.preventDefault(); close(); }
        else if (e.key === 'ArrowLeft' && multi) { e.preventDefault(); render(idx - 1); }
        else if (e.key === 'ArrowRight' && multi) { e.preventDefault(); render(idx + 1); }
        else if (e.key === 'Tab') {              
            var f = [closeBtn];
            if (multi) f.push(prevBtn, nextBtn);
            f = f.concat(postLinks, [orig]);
            var cur = f.indexOf(document.activeElement);
            var next = e.shiftKey ? (cur <= 0 ? f.length - 1 : cur - 1) : (cur === f.length - 1 ? 0 : cur + 1);
            e.preventDefault();
            f[next].focus();
        }
    });

    
    var tx = 0, ty = 0;
    stage.addEventListener('touchstart', function (e) {
        var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
    });
    stage.addEventListener('touchend', function (e) {
        if (!multi) return;
        var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) render(dx < 0 ? idx + 1 : idx - 1);
    });

    
    root.querySelectorAll('.gallery-link').forEach(function (a) {
        a.addEventListener('click', function (e) {
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return; 
            e.preventDefault();
            open(parseInt(a.getAttribute('data-i'), 10) || 0, a);
        });
    });
})();
</script>

    <script>
(function () {
  var refs = document.querySelectorAll('.footnote-ref');
  if (!refs.length) return;

  var tooltip = document.createElement('div');
  tooltip.className = 'footnote-tooltip';
  tooltip.style.display = 'none';
  document.body.appendChild(tooltip);

  function showTooltip(ref) {
    var href = ref.getAttribute('href');
    var id = decodeURIComponent(href.slice(1));   
    var note = document.getElementById(id);        
    if (!note) return;

    var clone = note.cloneNode(true);
    var backref = clone.querySelector('.footnote-backref');
    if (backref) backref.remove();
    tooltip.innerHTML = clone.innerHTML;

    var rect = ref.getBoundingClientRect();
    tooltip.style.display = 'block';
    var top = rect.top + window.scrollY - tooltip.offsetHeight - 8;
    var left = rect.left + window.scrollX - (tooltip.offsetWidth / 2) + (rect.width / 2);
    left = Math.max(8, Math.min(left, window.innerWidth - tooltip.offsetWidth - 8));

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  refs.forEach(function (ref) {
    ref.addEventListener('mouseenter', function () { showTooltip(ref); });
    ref.addEventListener('mouseleave', hideTooltip);
    ref.addEventListener('focus', function () { showTooltip(ref); });
    ref.addEventListener('blur', hideTooltip);
    ref.addEventListener('click', function (e) {
      e.preventDefault();
      if (tooltip.style.display === 'block') {
        hideTooltip();
      } else {
        showTooltip(ref);
      }
    });
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.footnote-ref')) hideTooltip();
  });
})();
</script>

(function () {
  var btns = document.querySelectorAll('.random-post-btn');
  if (!btns.length) return;

  btns.forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var url = btn.getAttribute('data-random-json');
      if (!url) return;

      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (list) {
          if (!list || !list.length) return;
          var pick = list[Math.floor(Math.random() * list.length)];
          if (pick && pick.url) window.location.href = pick.url;
        })
        .catch(function (err) {
          console.error('Random post: could not load post list.', err);
        });
    });
  });
})();
