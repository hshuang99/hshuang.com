[params]
    # Show the "built on Hugo" disclaimer
    showhugo = false

    # Urls for social networks
    facebook = ""
    twitter = ""
    linkedin = ""
    github = ""
    gitlab = ""
    # NOTE: params.rss was removed — the footer now links to each
    # language's own feed automatically (see footer.html), since RSS
    # feeds are per-language once a site is multilingual.
    # NOTE: copyrightname / copyright.* were moved into each
    # [languages.<lang>.params] block above so the copyright name can
    # differ (or stay the same) per language — see zh-tw / en sections.

    # Enables or disables the loading animations. false activates them. Default is false.
    loadfastload = false

    # Sets the speed for the page loading effect. Default is 1.0.
    loadspeedfactor = 1.0

    # Enables or disables the second flyby cursor. Default is false.
    loadonepass = false

[taxonomies]
category = "categories"
tag = "tags"

# --- Random-post button --------------------------------------------------
# Produces posts/index.random.json (and en/posts/index.random.json) — a
# tiny JSON list of {url,title} for every post, fetched only when the
# "Random post" nav button is clicked (see header.html / footer.html).
[outputFormats]
    [outputFormats.RandomPosts]
        mediaType = "application/json"
        baseName = "index.random"
        isPlainText = true
        notAlternative = true

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.x]
    disableInlineCSS = true
