baseURL = "https://hshuang.com"
theme = "hugo.386"
preserveTaxonomyNames = true
hasCJKLanguage = true

# --- Multilingual setup ------------------------------------------------
# zh-tw is the default language and keeps clean URLs (no "/zh-tw/" prefix).
# Any other language (en) automatically gets its own URL prefix ("/en/…")
# as soon as more than one [languages.*] block is defined below — that is
# controlled by defaultContentLanguageInSubdir, which stays false so ONLY
# the default language is prefix-free.
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false

# Translations are matched by filename suffix, e.g.:
#   content/posts/hello.md      -> zh-tw (default, no suffix needed)
#   content/posts/hello.en.md   -> en
# No contentDir split needed, so none of your existing content has to move.

[languages]
    [languages.zh-tw]
        label           = "繁體中文"
        weight = 1
        title = "黃宏勝的部落格 | hshuang.com"
